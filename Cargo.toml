[package]
name = "oyun-bulucu"
version = "0.1.0"
edition = "2021"
description = "Çok kaynaklı Rust oyun bulucu — Steam, Epic, App Store, Google Play, GOG, itch.io ve kıyı kenar haber siteleri"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.20"
futures = "0.3"
urlencoding = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
