<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineScout — Movie Discovery Engine | senkron.tech</title>
  <style>
    :root {
      --bg: #0b0e14;
      --bg-elev: #111622;
      --surface: #141a28;
      --surface-2: #1c2437;
      --border: #27324a;
      --text: #eef2fa;
      --muted: #93a2bd;
      --accent: #f43f5e;
      --accent-2: #6366f1;
      --gold: #f59e0b;
      --cyan: #38bdf8;
      --green: #10b981;
      --netflix: #e50914;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; overflow-x: hidden; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      background-image:
        radial-gradient(circle at 10% 0%, rgba(244, 63, 94, 0.14), transparent 36%),
        radial-gradient(circle at 90% 6%, rgba(99, 102, 241, 0.16), transparent 36%),
        radial-gradient(circle at 50% 90%, rgba(245, 158, 11, 0.08), transparent 44%);
    }
    a { color: inherit; }
    button, input, select { font-family: inherit; }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 60;
      background: rgba(11, 14, 20, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .header-wrap {
      max-width: 1480px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .back-link {
      text-decoration: none;
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      transition: border-color .15s, color .15s;
    }
    .back-link:hover { border-color: var(--cyan); color: #fff; }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.18rem;
      letter-spacing: -0.02em;
    }
    .rust-pill {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .ctrl-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 0.82rem;
    }
    .ctrl-label { color: var(--muted); font-weight: 600; }
    .ctrl-select {
      background: transparent;
      border: none;
      color: var(--text);
      font-weight: 700;
      font-size: 0.84rem;
      outline: none;
      cursor: pointer;
    }
    .ctrl-select option { background: #141a28; color: #eef2fa; }
    .lang-toggle {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2px;
      gap: 2px;
    }
    .lang-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.78rem;
      padding: 5px 10px;
      border-radius: 7px;
      cursor: pointer;
      transition: all .15s;
    }
    .lang-btn.active {
      background: linear-gradient(135deg, var(--accent), #e11d48);
      color: #fff;
    }

    /* Search row */
    .search-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr auto auto;
      gap: 10px;
      align-items: center;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 12px;
      font-size: 0.95rem;
      opacity: 0.75;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 32px 10px 36px;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.14);
    }
    .clear-btn {
      position: absolute;
      right: 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 1.05rem;
      cursor: pointer;
      padding: 2px 6px;
      display: none;
    }
    .clear-btn.visible { display: block; }
    .clear-btn:hover { color: #fff; }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #e11d48);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
      transition: transform .1s, filter .15s;
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: border-color .15s, background .15s;
    }
    .btn-secondary:hover { border-color: var(--gold); color: #fff; }

    /* Main Layout */
    .main-container {
      max-width: 1480px;
      margin: 0 auto;
      padding: 18px 20px 64px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Tabs + Quick Actions */
    .tabs-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .tabs-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 15px;
      border-radius: 99px;
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all .15s;
    }
    .tab-btn:hover { color: #fff; border-color: #3a4a6b; }
    .tab-btn.active {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.22), rgba(99, 102, 241, 0.22));
      border-color: var(--accent);
      color: #fff;
    }
    .tab-count {
      background: rgba(255,255,255,0.1);
      padding: 1px 7px;
      border-radius: 99px;
      font-size: 0.75rem;
    }
    .filter-toggle-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.84rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .filter-toggle-btn:hover { border-color: var(--cyan); }

    /* Filter Studio */
    .filter-studio {
      background: rgba(20, 26, 40, 0.92);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .filter-studio.collapsed { display: none; }
    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .filter-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .filter-title {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .chip {
      background: var(--bg);
      border: 1px solid var(--border);
      color: #cbd5e1;
      padding: 5px 11px;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all .14s;
      user-select: none;
    }
    .chip:hover { border-color: #4f638d; color: #fff; }
    .chip.active {
      background: rgba(244, 63, 94, 0.18);
      border-color: var(--accent);
      color: #ffe4e6;
      box-shadow: 0 0 12px rgba(244, 63, 94, 0.18);
    }
    .chip.mood.active {
      background: rgba(99, 102, 241, 0.22);
      border-color: var(--accent-2);
      color: #e0e7ff;
    }
    .chip.platform.active {
      background: rgba(16, 185, 129, 0.18);
      border-color: var(--green);
      color: #d1fae5;
    }
    .chip.country.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--cyan);
      color: #e0f2fe;
    }
    .chip.star.active {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--gold);
      color: #fef3c7;
    }
    .chip.netflix-star.active {
      background: rgba(229, 9, 20, 0.24);
      border-color: var(--netflix);
      color: #fecaca;
    }

    .filter-grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 14px;
      padding-top: 4px;
      border-top: 1px solid rgba(39, 50, 74, 0.7);
    }
    .rating-box, .meta-box {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .seg-group {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 2px;
      gap: 2px;
      width: fit-content;
    }
    .seg-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 5px 11px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .seg-btn.active { background: var(--surface-2); color: #fff; }
    .seg-btn.active.imdb { background: rgba(245, 158, 11, 0.22); color: #fcd34d; }
    .seg-btn.active.netflix { background: rgba(229, 9, 20, 0.26); color: #fca5a5; }

    .inline-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.81rem;
      font-weight: 600;
      color: #dbeafe;
      cursor: pointer;
      user-select: none;
    }
    .toggle-pill input { accent-color: var(--gold); width: 15px; height: 15px; cursor: pointer; }
    .field-select, .field-input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      outline: none;
    }
    .field-input { width: 82px; }
    .field-select:focus, .field-input:focus { border-color: var(--cyan); }
    .reset-btn {
      border: 1px solid rgba(244, 63, 94, 0.45);
      background: rgba(244, 63, 94, 0.1);
      color: #fda4af;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .reset-btn:hover { background: rgba(244, 63, 94, 0.22); color: #fff; }

    /* Status Bar */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      font-size: 0.83rem;
    }
    .status-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .source-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .src-pill {
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
    }
    .src-pill.ok { border-color: rgba(16, 185, 129, 0.45); color: #6ee7b7; }
    .src-pill.err { border-color: rgba(244, 63, 94, 0.45); color: #fda4af; }

    /* Movie Grid */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 18px;
    }
    .movie-card {
      background: linear-gradient(180deg, #161d2d, #111623);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .18s, border-color .18s, box-shadow .18s;
      position: relative;
    }
    .movie-card:hover {
      transform: translateY(-4px);
      border-color: rgba(244, 63, 94, 0.65);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.48);
    }
    .poster-box {
      position: relative;
      aspect-ratio: 2 / 3;
      background: linear-gradient(135deg, #1a2235, #0f1420);
      overflow: hidden;
      cursor: pointer;
    }
    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .25s;
    }
    .movie-card:hover .poster-box img { transform: scale(1.03); }
    .poster-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      text-align: center;
      color: var(--muted);
      gap: 8px;
    }
    .poster-overlay-top {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
      pointer-events: none;
    }
    .rating-stack { display: flex; flex-direction: column; gap: 4px; }
    .badge-score {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 7px;
      font-size: 0.77rem;
      font-weight: 800;
      backdrop-filter: blur(8px);
      width: fit-content;
    }
    .badge-imdb { background: rgba(11, 14, 20, 0.85); border: 1px solid rgba(245, 158, 11, 0.65); color: #fcd34d; }
    .badge-netflix { background: rgba(20, 5, 8, 0.86); border: 1px solid rgba(229, 9, 20, 0.7); color: #fecaca; }
    .badge-rt { background: rgba(11, 14, 20, 0.85); border: 1px solid rgba(244, 63, 94, 0.55); color: #fda4af; }
    .poster-overlay-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 10px 8px;
      background: linear-gradient(to top, rgba(11, 14, 20, 0.94), transparent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #e2e8f0;
      pointer-events: none;
    }

    .card-body {
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .card-title {
      font-size: 0.98rem;
      font-weight: 800;
      line-height: 1.28;
      color: #fff;
      cursor: pointer;
    }
    .card-title:hover { color: #fda4af; }
    .card-orig {
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .pill-line {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .mini-pill {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--surface-2);
      color: #cbd5e1;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .mini-pill.mood {
      background: rgba(99, 102, 241, 0.16);
      border-color: rgba(99, 102, 241, 0.35);
      color: #c7d2fe;
    }
    .card-synopsis {
      font-size: 0.8rem;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .offers-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: auto;
      padding-top: 4px;
    }
    .offer-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 3px 7px;
      border-radius: 7px;
      font-size: 0.71rem;
      font-weight: 700;
      color: #e2e8f0;
      transition: border-color .15s;
    }
    .offer-chip:hover { border-color: var(--green); }
    .offer-chip img { width: 15px; height: 15px; border-radius: 3px; }
    .offer-type { color: var(--muted); font-weight: 600; font-size: 0.67rem; }
    .no-offers { font-size: 0.73rem; color: #64748b; font-style: italic; }

    .card-stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      padding-top: 4px;
      border-top: 1px solid rgba(39, 50, 74, 0.65);
    }
    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-top: 2px;
    }
    .watch-stepper {
      display: inline-flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .step-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 4px 8px;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .step-btn:hover { background: var(--surface-2); color: #fff; }
    .step-val {
      padding: 3px 6px;
      font-size: 0.75rem;
      font-weight: 800;
      color: #e2e8f0;
    }
    .step-val.has-watched { color: var(--green); }
    .icon-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 0.77rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .icon-btn:hover { border-color: var(--cyan); color: #fff; }
    .icon-btn.saved {
      background: rgba(245, 158, 11, 0.16);
      border-color: var(--gold);
      color: #fcd34d;
    }

    /* Loading & Empty */
    .loading-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 18px;
    }
    .skeleton-card {
      height: 450px;
      border-radius: var(--radius);
      background: linear-gradient(90deg, #131926 25%, #1c2437 50%, #131926 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border: 1px solid var(--border);
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .empty-state {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* Detail Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 11, 0.84);
      backdrop-filter: blur(8px);
      z-index: 120;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      width: 100%;
      max-width: 980px;
      background: #121723;
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65);
      position: relative;
      margin: auto 0;
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(11, 14, 20, 0.78);
      color: #fff;
      font-size: 1.15rem;
      cursor: pointer;
    }
    .modal-close:hover { background: var(--accent); border-color: var(--accent); }
    .modal-hero {
      position: relative;
      min-height: 250px;
      background: #0d111a;
      background-size: cover;
      background-position: center;
      padding: 28px 24px 22px;
      display: flex;
      align-items: flex-end;
      gap: 20px;
      flex-wrap: wrap;
    }
    .modal-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, #121723 6%, rgba(18, 23, 35, 0.72) 60%, rgba(11, 14, 20, 0.6) 100%);
    }
    .modal-poster {
      position: relative;
      z-index: 2;
      width: 135px;
      aspect-ratio: 2 / 3;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 12px 28px rgba(0,0,0,0.55);
      background: #192133;
    }
    .modal-hero-info {
      position: relative;
      z-index: 2;
      flex: 1;
      min-width: 240px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .modal-title { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 800; line-height: 1.15; }
    .modal-sub { color: #cbd5e1; font-size: 0.9rem; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fde68a;
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      width: fit-content;
    }
    .modal-body {
      padding: 20px 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .ratings-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 10px;
    }
    .rating-card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .rating-card .rk { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; }
    .rating-card .rv { font-size: 1.05rem; font-weight: 800; color: #fff; }
    .rating-card .rs { font-size: 0.75rem; color: var(--muted); }
    .star-picker { display: inline-flex; gap: 3px; margin-top: 2px; }
    .star-pick-btn {
      border: none;
      background: transparent;
      font-size: 1.12rem;
      cursor: pointer;
      color: #475569;
      padding: 0 2px;
    }
    .star-pick-btn.lit { color: var(--gold); }

    .sec-block { display: flex; flex-direction: column; gap: 9px; }
    .sec-h { font-size: 0.84rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 800; }

    .offers-groups { display: flex; flex-direction: column; gap: 10px; }
    .offer-group-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .offer-group-lbl { min-width: 90px; font-size: 0.78rem; font-weight: 700; color: var(--muted); }
    .offer-detail-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 11px;
      border-radius: 9px;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .offer-detail-btn:hover { border-color: var(--green); }
    .offer-detail-btn img { width: 20px; height: 20px; border-radius: 4px; }

    .trailer-player {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #000;
    }
    .stills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 10px;
    }
    .still-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 9px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform .15s, border-color .15s;
    }
    .still-img:hover { transform: scale(1.02); border-color: var(--cyan); }

    .people-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .person-chip {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      color: #e2e8f0;
      padding: 5px 10px;
      border-radius: 99px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .person-chip:hover { border-color: var(--accent); color: #fff; }
    .person-role { color: var(--muted); font-size: 0.73rem; }

    .provenance-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .prov-link {
      text-decoration: none;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 0.79rem;
      font-weight: 700;
      color: #93c5fd;
    }
    .prov-link:hover { border-color: var(--cyan); color: #fff; }

    .similar-strip {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 10px;
    }
    .sim-card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .15s, transform .15s;
    }
    .sim-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .sim-card img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; display: block; background: #192133; }
    .sim-info { padding: 7px 8px; font-size: 0.76rem; }
    .sim-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sim-meta { color: var(--muted); font-size: 0.7rem; }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.93);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 92vw; max-height: 86vh; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
    .lb-btn {
      position: fixed;
      background: rgba(20, 26, 40, 0.85);
      border: 1px solid rgba(255,255,255,0.22);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .lb-btn:hover { background: var(--accent); }
    .lb-close { top: 18px; right: 18px; }
    .lb-prev { left: 18px; top: 50%; transform: translateY(-50%); }
    .lb-next { right: 18px; top: 50%; transform: translateY(-50%); }
    .lb-count { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 0.85rem; color: #cbd5e1; background: rgba(0,0,0,0.65); padding: 4px 12px; border-radius: 99px; }

    @media (max-width: 820px) {
      .search-row { grid-template-columns: 1fr; }
      .movie-grid, .loading-grid { grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 12px; }
      .modal-hero { padding: 18px; }
      .modal-poster { width: 100px; }
      .modal-body { padding: 16px; }

      function loadUserStore() {
        try {
          const rawStr = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY) || '{}';
          const raw = JSON.parse(rawStr);
          return {
            lang: raw.lang === 'tr' ? 'tr' : 'en',
            region: raw.region || (navigator.language && navigator.language.toLowerCase().startsWith('tr') ? 'TR' : 'US'),
            watchlist: raw.watchlist && typeof raw.watchlist === 'object' ? raw.watchlist : {},
            watched: raw.watched && typeof raw.watched === 'object' ? raw.watched : {}
          };
        } catch (e) {
          return { lang: 'en', region: 'US', watchlist: {}, watched: {} };
        }
      }

        try {

      const el = (id) => document.getElementById(id);

      function escHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function safeUrl(u) {
        if (typeof u !== 'string') return '';
        const t = u.trim();
        return /^https?:\/\//i.test(t) ? t : '';
      }

      function validYtId(id) {
        return typeof id === 'string' && /^[A-Za-z0-9_-]{1,32}$/.test(id.trim());
      }

      function formatVotes(n) {
        if (!n && n !== 0) return '—';
        if (n >= 1000000) return (n / 1000000).toFixed(2).replace(/\.00$/, '') + 'M';
        if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'K';
        return String(n);
      }

      function t(key, vars) {
        const dict = I18N[store.lang] || I18N.en;
        let str = dict[key] || I18N.en[key] || key;
        if (vars) {
          Object.keys(vars).forEach((k) => {
            str = str.replace('{' + k + '}', vars[k]);
          });
        }
        return str;
      }

      function moodObj(slug) {
        return MOODS.find((m) => m.slug === slug);
      }

      function countryLabel(code) {
        const all = [...QUICK_COUNTRIES, ...EXTRA_COUNTRIES];
        const found = all.find((c) => c.code === code);
        if (found) return `${found.flag} ${found[store.lang]}`;
        return `${COUNTRY_FLAGS[code] || '🏳️'} ${code}`;
      }

      function getWatchCount(id) {
        return store.watched[id] ? (store.watched[id].count || 0) : 0;
      }

      function getPersonalRating(id) {
        return store.watched[id] ? (store.watched[id].personalRating || 0) : 0;
      }

      function isWatchlisted(id) {
        return Boolean(store.watchlist[id]);
      }

      function rememberMovieSnapshot(movie) {
        if (!movie || !movie.id) return;
        state.moviesById[movie.id] = movie;
        if (store.watchlist[movie.id]) {
          store.watchlist[movie.id] = movie;
          saveStore();
        }
        if (store.watched[movie.id]) {
          store.watched[movie.id].movie = movie;
          saveStore();
        }
      }

      function adjustWatchCount(id, delta, movieOpt) {
        const movie = movieOpt || state.moviesById[id] || (store.watched[id] && store.watched[id].movie) || store.watchlist[id];
        if (!movie) return;
        const cur = store.watched[id] || { count: 0, personalRating: 0, lastWatchedAt: null, movie };
        const next = Math.max(0, (cur.count || 0) + delta);
        if (next === 0 && !cur.personalRating) {
          delete store.watched[id];
        } else {
          store.watched[id] = {
            count: next,
            personalRating: cur.personalRating || 0,
            lastWatchedAt: next > 0 ? new Date().toISOString() : cur.lastWatchedAt,
            movie
          };
        }
        saveStore();
        updateTabCounts();
        renderActiveTab();
      }

      function setPersonalRating(id, stars, movieOpt) {
        const movie = movieOpt || state.moviesById[id] || (store.watched[id] && store.watched[id].movie) || store.watchlist[id];
        if (!movie) return;
        const cur = store.watched[id] || { count: 1, personalRating: 0, lastWatchedAt: new Date().toISOString(), movie };
        cur.personalRating = cur.personalRating === stars ? 0 : stars;
        if (cur.count === 0 && cur.personalRating > 0) {
          cur.count = 1;
          cur.lastWatchedAt = new Date().toISOString();
        }
        cur.movie = movie;
        store.watched[id] = cur;
        saveStore();
        updateTabCounts();
        renderActiveTab();
      }

      function toggleWatchlist(id, movieOpt) {
        const movie = movieOpt || state.moviesById[id] || store.watchlist[id] || (store.watched[id] && store.watched[id].movie);
        if (!movie) return;
        if (store.watchlist[id]) {
          delete store.watchlist[id];
        } else {
          store.watchlist[id] = movie;
        }
        saveStore();
        updateTabCounts();
        renderActiveTab();
      }

        const totalWatches = watchedEntries.reduce((acc, e) => acc + (e.count || 0), 0);
        el('cnt-watched').textContent = `${watchedEntries.length} · ${totalWatches}×`;

      function renderFilterChips() {
        // Moods
        el('mood-chips').innerHTML = MOODS.map((m) => `
          <button type="button" class="chip mood${state.mood === m.slug ? ' active' : ''}" data-mood="${m.slug}">

          </button>

        // Genres
        el('genre-chips').innerHTML = GENRES.map((g) => `

            ${escHtml(g[store.lang])}
          </button>
        `).join('');

        // Region-filtered platforms
        const availPlats = PLATFORMS_BASE.filter(
          (p) => p.regions === 'ALL' || p.regions.includes(store.region)
        );
        const validSlugs = availPlats.map((p) => p.slug);
        state.platforms = state.platforms.filter((s) => validSlugs.includes(s));

        el('platform-chips').innerHTML = availPlats.map((p) => `
          <button type="button" class="chip platform${state.platforms.includes(p.slug) ? ' active' : ''}" data-platform="${p.slug}">
            ${escHtml(p.label)}
          </button>
        `).join('');

        document.querySelectorAll('#monetization-seg .seg-btn').forEach((b) => {
          b.classList.toggle('active', b.dataset.mon === state.monetization);
        });

        // Rating thresholds
        el('rs-imdb').classList.toggle('active', state.rating_system === 'imdb');
        el('rs-netflix').classList.toggle('active', state.rating_system === 'netflix');
        const list = state.rating_system === 'netflix' ? NETFLIX_THRESHOLDS : IMDB_THRESHOLDS;
        const cls = state.rating_system === 'netflix' ? 'netflix-star' : 'star';
        el('rating-chips').innerHTML = list.map((item) => `
          <button type="button" class="chip ${cls}${Math.abs(state.min_rating - item.val) < 0.05 ? ' active' : ''}" data-min-rating="${item.val}">
            ${escHtml(item[store.lang])}
          </button>
        `).join('');

        // Origin countries
        const allShown = [...QUICK_COUNTRIES];
        state.origin_countries.forEach((cc) => {
          if (!allShown.some((x) => x.code === cc)) {
            const extra = EXTRA_COUNTRIES.find((x) => x.code === cc);
            if (extra) allShown.push(extra);
          }
        });
        el('country-chips').innerHTML = allShown.map((c) => `
          <button type="button" class="chip country${state.origin_countries.includes(c.code) ? ' active' : ''}" data-country="${c.code}">
            <span>${c.flag}</span><span>${escHtml(c[store.lang])}</span>

        el('extra-country-select').innerHTML = `<option value="">${escHtml(t('moreCountry'))}</option>` +
          EXTRA_COUNTRIES.map((c) => `<option value="${c.code}">${c.flag} ${escHtml(c[store.lang])}</option>`).join('');
      }

      async function runSearch() {
        state.loading = true;
        if (state.tab === 'discover') renderLoading();
        el('status-text').textContent = t('loading');

        const payload = {
          query: state.query.trim(),
          actor: state.actor.trim(),
          genres: state.genres,
          mood: state.mood,
          platforms: state.platforms,
          monetization: state.monetization,
          origin_countries: state.origin_countries,
          region: store.region,
          lang: store.lang,
          rating_system: state.rating_system,
          min_rating: state.min_rating > 0 ? state.min_rating : null,
          min_votes: state.min_votes > 0 ? state.min_votes : null,
          must_have_rating: state.must_have_rating,
          year_from: state.year_from ? parseInt(state.year_from, 10) : null,
          year_to: state.year_to ? parseInt(state.year_to, 10) : null,
          sort_by: state.sort_by,
          limit: 36
        };

        try {
          const resp = await fetch('/api/movies/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const data = await resp.json();
          state.movies = Array.isArray(data.results) ? data.results : [];
          state.movies.forEach(rememberMovieSnapshot);
          state.lastMeta = data;
          renderStatus(data);
        } catch (err) {
          state.movies = [];
          el('status-text').textContent = 'Error: ' + (err.message || err);
        } finally {
          state.loading = false;
          updateTabCounts();
          renderActiveTab();
        }
      }

      function renderStatus(data) {
        if (!data) return;
        let msg = t('foundMsg', { n: data.filtered_count, ms: data.elapsed_ms });
        if (data.cached) msg += ` · ⚡ ${t('cachedTag')}`;
        msg += ` · ${data.region}`;
        el('status-text').textContent = msg;

        const pills = (data.sources_status || []).map((s) => `
          <span class="src-pill ${s.ok ? 'ok' : 'err'}">
            ${escHtml(s.name)} ${s.ok ? '✓' : '✗'} (${s.count})
          </span>
        `).join('');
        el('source-pills').innerHTML = pills;
      }

      function renderLoading() {

      function renderMovieCard(m) {
        const poster = safeUrl(m.poster_url);
        const wCount = getWatchCount(m.id);
        const saved = isWatchlisted(m.id);
        const countriesHtml = (m.origin_countries || []).slice(0, 3).map((c) => COUNTRY_FLAGS[c] || c).join(' ');
        const genresHtml = (m.genres || []).slice(0, 3).map((g) => `<span class="mini-pill">${escHtml(g.label)}</span>`).join('');
        const moodsHtml = (m.moods || []).slice(0, 2).map((slug) => {
          const mo = moodObj(slug);
          return mo ? `<span class="mini-pill mood">${mo.icon} ${escHtml(mo[store.lang])}</span>` : '';
        }).join('');

        const imdbBadge = m.imdb_score != null
          ? `<span class="badge-score badge-imdb">★ ${m.imdb_score.toFixed(1)} IMDb</span>`
          : '';
        const netflixBadge = m.netflix_match_pct != null
          ? `<span class="badge-score badge-netflix">${m.netflix_match_pct}% · ${m.netflix_stars != null ? m.netflix_stars.toFixed(1) + '★' : ''}</span>`
          : '';
        const primaryBadge = state.rating_system === 'netflix'
          ? (netflixBadge + imdbBadge)
          : (imdbBadge + netflixBadge);
        const rtBadge = m.tomato_meter != null
          ? `<span class="badge-score badge-rt">🍅 ${m.tomato_meter}%</span>`
          : '';

        const monDict = I18N[store.lang].monTypes;
        const offers = (m.offers || []).slice(0, 4);
        const offersHtml = offers.length
          ? offers.map((o) => {
              const icon = safeUrl(o.provider_icon);
              const url = safeUrl(o.url);
              const lbl = monDict[o.monetization_type] || o.monetization_type;
              return `<a class="offer-chip" href="${escHtml(url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
                ${icon ? `<img src="${escHtml(icon)}" alt="" loading="lazy" />` : ''}
                <span>${escHtml(o.provider_name)}</span>
                <span class="offer-type">${escHtml(o.price || lbl)}</span>
              </a>`;
            }).join('')
          : `<span class="no-offers">${escHtml(t('notStreaming', { reg: store.region }))}</span>`;

        const hasTrailer = (m.trailers || []).length > 0;
        const runtimeStr = m.runtime_min ? `${m.runtime_min}m` : '';

        return `
          <article class="movie-card" data-movie-id="${escHtml(m.id)}">
            <div class="poster-box js-open-detail" data-movie-id="${escHtml(m.id)}">
              ${poster
                ? `<img src="${escHtml(poster)}" alt="${escHtml(m.title)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
                   <div class="poster-fallback" style="display:none"><span style="font-size:2rem">🎬</span><strong>${escHtml(m.title)}</strong></div>`
                : `<div class="poster-fallback"><span style="font-size:2rem">🎬</span><strong>${escHtml(m.title)}</strong></div>`
              }
              <div class="poster-overlay-top">
                <div class="rating-stack">${primaryBadge}</div>
                <div>${rtBadge}</div>
              </div>
              <div class="poster-overlay-bottom">
                <span>${m.year || ''} ${runtimeStr ? '· ' + runtimeStr : ''}</span>
                <span>${escHtml(countriesHtml)}</span>
              </div>
            </div>
            <div class="card-body">
              <div>
                <div class="card-title js-open-detail" data-movie-id="${escHtml(m.id)}">${escHtml(m.title)}</div>
                ${m.original_title ? `<div class="card-orig">${escHtml(m.original_title)}</div>` : ''}
              </div>
              <div class="pill-line">${genresHtml}${moodsHtml}</div>
              ${m.synopsis ? `<p class="card-synopsis">${escHtml(m.synopsis)}</p>` : ''}
              <div class="offers-strip">${offersHtml}</div>
              <div class="card-stats">
                <span>👁 ${formatVotes(m.imdb_votes)} ${escHtml(t('ratingsVotes'))}</span>
                <span>📚 ${(m.sources || []).length} ${escHtml(t('sourcesLbl'))}</span>
              </div>
              <div class="card-actions">
                <div class="watch-stepper" title="${escHtml(t('timesWatched'))}">
                  <button type="button" class="step-btn js-watch-dec" data-movie-id="${escHtml(m.id)}">−</button>
                  <span class="step-val${wCount > 0 ? ' has-watched' : ''}">👁 ${wCount}×</span>
                  <button type="button" class="step-btn js-watch-inc" data-movie-id="${escHtml(m.id)}">+</button>
                </div>
                <div style="display:flex;gap:5px;">
                  <button type="button" class="icon-btn${saved ? ' saved' : ''} js-toggle-save" data-movie-id="${escHtml(m.id)}">
                    ${saved ? '🔖' : '🏷️'}
                  </button>
                  ${hasTrailer ? `<button type="button" class="icon-btn js-open-trailer" data-movie-id="${escHtml(m.id)}">▶</button>` : ''}
                  <button type="button" class="icon-btn js-open-detail" data-movie-id="${escHtml(m.id)}">${escHtml(t('details'))}</button>
                </div>
              </div>
            </div>
          </article>
        `;
      }

      function renderActiveTab() {
        const root = el('results-root');
        let list = [];
        let emptyKey = 'emptyDiscover';

        if (state.tab === 'discover') {
          if (state.loading) {
            renderLoading();
            return;
          }
          list = state.movies;
        } else if (state.tab === 'watchlist') {
          emptyKey = 'emptyWatchlist';
          list = Object.values(store.watchlist);
        } else {
          emptyKey = 'emptyWatched';
          list = Object.values(store.watched)
            .sort((a, b) => (b.count || 0) - (a.count || 0))
            .map((e) => e.movie)
            .filter(Boolean);
        }

        if (state.tab !== 'discover') {
          const q = state.query.trim().toLowerCase();
          if (q) {
            list = list.filter((m) =>
              (m.title && m.title.toLowerCase().includes(q)) ||
              (m.original_title && m.original_title.toLowerCase().includes(q))
            );
          }
        }

        if (!list.length) {
          root.innerHTML = `<div class="empty-state"><div style="font-size:2.3rem">🎞️</div><div>${escHtml(t(emptyKey))}</div></div>`;
          return;
        }

        root.innerHTML = `<div class="movie-grid">${list.map(renderMovieCard).join('')}</div>`;
      }

      async function openDetailModal(movieId, focusTrailer) {
        const baseMovie = state.moviesById[movieId] || store.watchlist[movieId] || (store.watched[movieId] && store.watched[movieId].movie);
        if (!baseMovie) return;

        state.activeDetail = null;
        el('detail-modal').classList.add('open');
        document.body.style.overflow = 'hidden';

        renderDetailModalBody(baseMovie, null, true, focusTrailer);

        const params = new URLSearchParams({
          country: store.region,
          lang: store.lang
        });
        if (baseMovie.id && baseMovie.id.startsWith('tm')) params.set('jw_id', baseMovie.id);
        if (baseMovie.imdb_id) params.set('imdb_id', baseMovie.imdb_id);
        if (baseMovie.title) params.set('title', baseMovie.title);
        if (baseMovie.year) params.set('year', String(baseMovie.year));

        try {
          const resp = await fetch('/api/movies/detail?' + params.toString());
          if (!resp.ok) throw new Error('Detail HTTP ' + resp.status);
          const detail = await resp.json();
          if (detail.movie) {
            state.activeDetail = detail;
            rememberMovieSnapshot(detail.movie);
            renderDetailModalBody(detail.movie, detail, false, focusTrailer);
          }
        } catch (err) {
          renderDetailModalBody(baseMovie, null, false, focusTrailer);
        }
      }

      function renderDetailModalBody(m, detail, isLoading, focusTrailer) {
        const bgUrl = safeUrl(m.backdrop_url || (m.screenshots && m.screenshots[0]));

        const pRating = getPersonalRating(m.id);
        const saved = isWatchlisted(m.id);

        const countriesStr = (m.origin_countries || []).map((c) => countryLabel(c)).join(', ');
        const genresStr = (m.genres || []).map((g) => `<span class="mini-pill">${escHtml(g.label)}</span>`).join('');
        const moodsStr = (m.moods || []).map((slug) => {
          const mo = moodObj(slug);
          return mo ? `<span class="mini-pill mood">${mo.icon} ${escHtml(mo[store.lang])}</span>` : '';

        // Offers grouped
        const monOrder = ['FLATRATE', 'FREE', 'ADS', 'RENT', 'BUY'];
        const monDict = I18N[store.lang].monTypes;
        const groupedOffers = monOrder.map((mt) => {

              <span class="offer-group-lbl">${escHtml(monDict[mt] || mt)}</span>

                  <span>↗</span>

              }).join('')}

          `;
        }).join('');

        // Trailers
        const trailers = (m.trailers || []).filter((tr) => validYtId(tr.youtube_id));
        const activeYt = trailers[0] ? trailers[0].youtube_id : null;
        const ytSearchUrl = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(`${m.title} ${m.year || ''} official trailer`);

        // Screenshots
        const stills = (m.screenshots || []).map(safeUrl).filter(Boolean);
        state.lightboxUrls = stills;

        // Cast & Crew
        const directorsHtml = (m.directors || []).map((d) => `
          <button type="button" class="person-chip js-search-person" data-person="${escHtml(d)}">

          </button>
        `).join('');
        const castHtml = (m.cast || []).map((c) => `
          <button type="button" class="person-chip js-search-person" data-person="${escHtml(c.name)}">
            🎭 ${escHtml(c.name)} ${c.character ? `<span class="person-role">(${escHtml(c.character)})</span>` : ''}
          </button>
        `).join('');

        // Sources
        const sourcesHtml = (m.sources || []).map((s) => {
          const url = safeUrl(s.url);
          return url ? `<a class="prov-link" href="${escHtml(url)}" target="_blank" rel="noopener noreferrer">📚 ${escHtml(s.name)} ↗</a>` : '';

        // Similar movies
        const similar = (detail && detail.similar_movies) || [];
        similar.forEach(rememberMovieSnapshot);

        el('modal-content').innerHTML = `
          <div class="modal-hero" style="${bgUrl ? `background-image:url('${escHtml(bgUrl)}')` : ''}">
            ${posterUrl ? `<img class="modal-poster" src="${escHtml(posterUrl)}" alt="${escHtml(m.title)}" />` : ''}
            <div class="modal-hero-info">
              <h2 class="modal-title" id="modal-title-el">${escHtml(m.title)}</h2>
              <div class="modal-sub">
                ${m.original_title ? `<span><em>${escHtml(m.original_title)}</em></span>` : ''}
                ${m.year ? `<span>📅 ${m.year}</span>` : ''}
                ${m.runtime_min ? `<span>⏱️ ${m.runtime_min} min</span>` : ''}
                ${countriesStr ? `<span>${countriesStr}</span>` : ''}
              </div>
              <div class="pill-line">${genresStr}${moodsStr}</div>
              ${detail && detail.awards ? `<div class="awards-banner">🏆 ${escHtml(detail.awards)}</div>` : ''}
              ${isLoading ? `<div style="font-size:0.8rem;color:var(--cyan);">⏳ ${escHtml(t('loadingDetail'))}</div>` : ''}
            </div>
          </div>

          <div class="modal-body">
            <div class="ratings-strip">
              <div class="rating-card">
                <span class="rk">IMDb</span>
                <span class="rv">${m.imdb_score != null ? `★ ${m.imdb_score.toFixed(1)} / 10` : '—'}</span>
                <span class="rs">${formatVotes(m.imdb_votes)} ${escHtml(t('ratingsVotes'))}</span>
              </div>
              <div class="rating-card">
                <span class="rk">Netflix ${escHtml(t('matchLabel'))}</span>
                <span class="rv" style="color:#fda4af">${m.netflix_match_pct != null ? `${m.netflix_match_pct}%` : '—'}</span>
                <span class="rs">${m.netflix_stars != null ? `${'★'.repeat(Math.round(m.netflix_stars))} ${m.netflix_stars.toFixed(1)} / 5` : '—'}</span>
              </div>
              <div class="rating-card">
                <span class="rk">Rotten Tomatoes / TMDB</span>
                <span class="rv">${m.tomato_meter != null ? `🍅 ${m.tomato_meter}%` : (m.tmdb_score != null ? `${m.tmdb_score.toFixed(1)} / 10` : '—')}</span>
                <span class="rs">${m.certified_fresh ? '✅ Certified Fresh · ' : ''}${m.tmdb_score != null ? `TMDB ${m.tmdb_score.toFixed(1)}` : ''}</span>
              </div>
              <div class="rating-card">
                <span class="rk">${escHtml(t('timesWatched'))} &amp; ${escHtml(t('myRating'))}</span>
                <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:2px;">
                  <div class="watch-stepper">
                    <button type="button" class="step-btn js-modal-watch-dec" data-movie-id="${escHtml(m.id)}">−</button>
                    <span class="step-val${wCount > 0 ? ' has-watched' : ''}">👁 ${wCount}×</span>
                    <button type="button" class="step-btn js-modal-watch-inc" data-movie-id="${escHtml(m.id)}">+</button>
                  </div>
                  <button type="button" class="icon-btn${saved ? ' saved' : ''} js-modal-save" data-movie-id="${escHtml(m.id)}">
                    ${saved ? '🔖 ' + escHtml(t('saved')) : '🏷️ ' + escHtml(t('save'))}
                  </button>
                </div>
                <div class="star-picker" data-movie-id="${escHtml(m.id)}">
                  ${[1, 2, 3, 4, 5].map((n) => `<button type="button" class="star-pick-btn${n <= pRating ? ' lit' : ''}" data-stars="${n}">★</button>`).join('')}
                </div>
              </div>
            </div>

            <div class="sec-block">
              <div class="sec-h">${escHtml(t('whereToWatch'))} (${escHtml(store.region)})</div>
              <div class="offers-groups">
                ${groupedOffers || `<div style="color:var(--muted);font-size:0.86rem;">${escHtml(t('noOffersModal'))}</div>`}
              </div>
            </div>

            <div class="sec-block" id="modal-trailer-sec">
              <div class="sec-h">${escHtml(t('trailersClips'))}</div>
              ${activeYt ? `
                <iframe id="yt-iframe" class="trailer-player" src="https://www.youtube.com/embed/${escHtml(activeYt)}?rel=0" title="${escHtml(m.title)} Trailer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                <div class="chip-row">
                  ${trailers.map((tr, idx) => `
                    <button type="button" class="chip${idx === 0 ? ' active' : ''} js-switch-yt" data-yt="${escHtml(tr.youtube_id)}">▶ ${escHtml(tr.title)}</button>
                  `).join('')}
                  <a class="prov-link" href="${escHtml(trailers[0].youtube_url)}" target="_blank" rel="noopener noreferrer">YouTube ↗</a>
                </div>
              ` : `
                <div><a class="prov-link" href="${escHtml(ytSearchUrl)}" target="_blank" rel="noopener noreferrer">▶ ${escHtml(t('searchYtTrailer'))}</a></div>
              `}
            </div>

            ${stills.length ? `
              <div class="sec-block">
                <div class="sec-h">${escHtml(t('screenshots'))}</div>
                <div class="stills-grid">
                  ${stills.map((u, idx) => `<img class="still-img js-open-lb" data-idx="${idx}" src="${escHtml(u)}" alt="${escHtml(m.title)} still ${idx + 1}" loading="lazy" />`).join('')}
                </div>
              </div>
            ` : ''}

            <div class="sec-block">
              <div class="sec-h">${escHtml(t('plotWiki'))}</div>
              <p style="color:#dbeafe;font-size:0.93rem;">${escHtml(m.synopsis || '—')}</p>
              ${detail && detail.wiki_extract ? `
                <p style="color:var(--muted);font-size:0.85rem;border-left:2px solid var(--cyan);padding-left:10px;">
                  ${escHtml(detail.wiki_extract)}
                  ${detail.wiki_url && safeUrl(detail.wiki_url) ? ` <a href="${escHtml(safeUrl(detail.wiki_url))}" target="_blank" rel="noopener noreferrer" style="color:var(--cyan);font-weight:700;">Wikipedia ↗</a>` : ''}
                </p>
              ` : ''}
            </div>

            <div class="sec-block">
              <div class="sec-h">${escHtml(t('castCrew'))}</div>
              <div class="people-chips">${directorsHtml}${writersHtml}${castHtml || '<span style="color:var(--muted)">—</span>'}</div>
            </div>

            <div class="sec-block">
              <div class="sec-h">${escHtml(t('provenance'))}</div>
              <div class="provenance-row">${sourcesHtml}</div>
            </div>

            ${similar.length ? `
              <div class="sec-block">
                <div class="sec-h">${escHtml(t('similarMovies'))}</div>
                <div class="similar-strip">
                  ${similar.map((sm) => `
                    <div class="sim-card js-open-sim" data-movie-id="${escHtml(sm.id)}">
                      ${safeUrl(sm.poster_url) ? `<img src="${escHtml(safeUrl(sm.poster_url))}" alt="${escHtml(sm.title)}" loading="lazy" />` : `<div style="aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;background:#192133;">🎬</div>`}
                      <div class="sim-info">
                        <div class="sim-title">${escHtml(sm.title)}</div>
                        <div class="sim-meta">${sm.year || ''} ${sm.imdb_score != null ? `· ★ ${sm.imdb_score.toFixed(1)}` : ''}</div>
                      </div>

              </div>

          </div>
        `;

        if (focusTrailer) {
          const sec = el('modal-trailer-sec');
          if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

      function closeModal() {
        state.activeDetail = null;
        el('detail-modal').classList.remove('open');
        el('modal-content').innerHTML = '';
        document.body.style.overflow = '';
      }

      function openLightbox(idx) {
        if (!state.lightboxUrls.length) return;
        state.lightboxIdx = (idx + state.lightboxUrls.length) % state.lightboxUrls.length;
        el('lb-img').src = state.lightboxUrls[state.lightboxIdx];
        el('lb-count').textContent = `${state.lightboxIdx + 1} / ${state.lightboxUrls.length}`;
        el('lightbox').classList.add('open');
      }

      function closeLightbox() {
        el('lightbox').classList.remove('open');
        el('lb-img').src = '';
      }

      function syncClearButtons() {
        el('clear-query').classList.toggle('visible', el('query-input').value.length > 0);
        el('clear-actor').classList.toggle('visible', el('actor-input').value.length > 0);
      }

      function resetFilters() {
        state.query = '';
        state.actor = '';
        state.mood = '';
        state.genres = [];
        state.platforms = [];
        state.monetization = 'all';
        state.origin_countries = [];
        state.min_rating = 0;
        state.min_votes = 0;
        state.must_have_rating = true;
        state.year_from = '';
        state.year_to = '';
        state.sort_by = 'popular';
        el('query-input').value = '';
        el('actor-input').value = '';
        el('must-rated-chk').checked = true;
        el('min-votes-select').value = '0';
        el('year-from-input').value = '';
        el('year-to-input').value = '';
        syncClearButtons();
        applyStaticTranslations();
        renderFilterChips();
        runSearch();
      }

      function bindEvents() {
        // Language toggle
        document.querySelectorAll('.lang-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            store.lang = btn.dataset.lang === 'tr' ? 'tr' : 'en';
            saveStore();
            applyStaticTranslations();
            renderFilterChips();
            runSearch();
          });
        });

        // Region selector
        el('region-select').addEventListener('change', (e) => {
          store.region = e.target.value;
          saveStore();
          renderFilterChips();
          runSearch();
        });

        // Inputs
        el('query-input').addEventListener('input', (e) => {
          state.query = e.target.value;
          syncClearButtons();
          if (state.tab !== 'discover') renderActiveTab();
        });
        el('actor-input').addEventListener('input', (e) => {
          state.actor = e.target.value;
          syncClearButtons();
        });
        el('query-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { state.tab = 'discover'; updateTabUi(); runSearch(); } });
        el('actor-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { state.tab = 'discover'; updateTabUi(); runSearch(); } });

        el('clear-query').addEventListener('click', () => {
          state.query = '';
          el('query-input').value = '';
          syncClearButtons();
          runSearch();
        });
        el('clear-actor').addEventListener('click', () => {
          state.actor = '';
          el('actor-input').value = '';
          syncClearButtons();
          runSearch();
        });

        el('search-btn').addEventListener('click', () => {
          state.tab = 'discover';
          updateTabUi();
          runSearch();
        });
        el('surprise-btn').addEventListener('click', () => {
          state.tab = 'discover';
          state.sort_by = 'random';
          state.must_have_rating = true;
          el('must-rated-chk').checked = true;
          updateTabUi();
          applyStaticTranslations();
          runSearch();
        });

        // Tabs
        document.querySelectorAll('.tab-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.tab = btn.dataset.tab;
            updateTabUi();
            renderActiveTab();
          });
        });

        // Collapse filters
        el('filter-toggle-btn').addEventListener('click', () => {
          state.filtersOpen = !state.filtersOpen;
          el('filter-studio').classList.toggle('collapsed', !state.filtersOpen);
          el('lbl-toggle-filters').textContent = state.filtersOpen ? t('hideFilters') : t('showFilters');
        });

        // Filter chip delegations
        el('mood-chips').addEventListener('click', (e) => {
          const btn = e.target.closest('[data-mood]');
          if (!btn) return;
          const slug = btn.dataset.mood;
          state.mood = state.mood === slug ? '' : slug;
          renderFilterChips();
          runSearch();
        });
        el('genre-chips').addEventListener('click', (e) => {
          const btn = e.target.closest('[data-genre]');
          if (!btn) return;
          const code = btn.dataset.genre;
          const idx = state.genres.indexOf(code);
          if (idx >= 0) state.genres.splice(idx, 1); else state.genres.push(code);
          renderFilterChips();
          runSearch();
        });
        el('platform-chips').addEventListener('click', (e) => {
          const btn = e.target.closest('[data-platform]');
          if (!btn) return;
          const slug = btn.dataset.platform;
          const idx = state.platforms.indexOf(slug);
          if (idx >= 0) state.platforms.splice(idx, 1); else state.platforms.push(slug);
          renderFilterChips();
          runSearch();
        });
        el('monetization-seg').addEventListener('click', (e) => {
          const btn = e.target.closest('[data-mon]');
          if (!btn) return;
          state.monetization = btn.dataset.mon;
          renderFilterChips();
          runSearch();
        });
        document.querySelectorAll('[data-rs]').forEach((btn) => {
          btn.addEventListener('click', () => {
            if (state.rating_system === btn.dataset.rs) return;
            state.rating_system = btn.dataset.rs;
            state.min_rating = 0;
            renderFilterChips();
            runSearch();
          });
        });
        el('rating-chips').addEventListener('click', (e) => {
          const btn = e.target.closest('[data-min-rating]');
          if (!btn) return;
          state.min_rating = parseFloat(btn.dataset.minRating) || 0;
          renderFilterChips();
          runSearch();
        });
        el('must-rated-chk').addEventListener('change', (e) => {
          state.must_have_rating = e.target.checked;
          runSearch();
        });
        el('min-votes-select').addEventListener('change', (e) => {
          state.min_votes = parseInt(e.target.value, 10) || 0;
          runSearch();
        });
        el('country-chips').addEventListener('click', (e) => {
          const btn = e.target.closest('[data-country]');
          if (!btn) return;
          const cc = btn.dataset.country;
          const idx = state.origin_countries.indexOf(cc);
          if (idx >= 0) state.origin_countries.splice(idx, 1); else state.origin_countries.push(cc);
          renderFilterChips();
          runSearch();
        });
        el('extra-country-select').addEventListener('change', (e) => {
          const cc = e.target.value;
          if (cc && !state.origin_countries.includes(cc)) {
            state.origin_countries.push(cc);
            renderFilterChips();
            runSearch();
          }
        });
        el('year-from-input').addEventListener('change', (e) => { state.year_from = e.target.value; runSearch(); });
        el('year-to-input').addEventListener('change', (e) => { state.year_to = e.target.value; runSearch(); });
        el('sort-select').addEventListener('change', (e) => { state.sort_by = e.target.value; runSearch(); });
        el('reset-filters-btn').addEventListener('click', resetFilters);

        // Card delegations
        el('results-root').addEventListener('click', (e) => {
          const inc = e.target.closest('.js-watch-inc');
          if (inc) { adjustWatchCount(inc.dataset.movieId, 1); return; }
          const dec = e.target.closest('.js-watch-dec');
          if (dec) { adjustWatchCount(dec.dataset.movieId, -1); return; }
          const save = e.target.closest('.js-toggle-save');
          if (save) { toggleWatchlist(save.dataset.movieId); return; }
          const trBtn = e.target.closest('.js-open-trailer');
          if (trBtn) { openDetailModal(trBtn.dataset.movieId, true); return; }
          const det = e.target.closest('.js-open-detail');
          if (det) { openDetailModal(det.dataset.movieId, false); return; }
        });

        // Modal delegations
        el('modal-close-btn').addEventListener('click', closeModal);
        el('detail-modal').addEventListener('click', (e) => {
          if (e.target === el('detail-modal')) closeModal();
        });
        el('modal-content').addEventListener('click', (e) => {
          const inc = e.target.closest('.js-modal-watch-inc');
          if (inc) {
            adjustWatchCount(inc.dataset.movieId, 1);
            const m = state.moviesById[inc.dataset.movieId];
            if (m) renderDetailModalBody(m, state.activeDetail, false, false);
            return;
          }
          const dec = e.target.closest('.js-modal-watch-dec');
          if (dec) {
            adjustWatchCount(dec.dataset.movieId, -1);
            const m = state.moviesById[dec.dataset.movieId];
            if (m) renderDetailModalBody(m, state.activeDetail, false, false);
            return;
          }
          const sv = e.target.closest('.js-modal-save');
          if (sv) {
            toggleWatchlist(sv.dataset.movieId);
            const m = state.moviesById[sv.dataset.movieId];
            if (m) renderDetailModalBody(m, state.activeDetail, false, false);
            return;
          }
          const star = e.target.closest('.star-pick-btn');
          if (star) {
            const picker = star.closest('.star-picker');
            const mid = picker && picker.dataset.movieId;
            if (mid) {
              setPersonalRating(mid, parseInt(star.dataset.stars, 10));
              const m = state.moviesById[mid];
              if (m) renderDetailModalBody(m, state.activeDetail, false, false);
            }
            return;
          }
          const ytBtn = e.target.closest('.js-switch-yt');
          if (ytBtn && validYtId(ytBtn.dataset.yt)) {
            const iframe = el('yt-iframe');
            if (iframe) iframe.src = `https://www.youtube.com/embed/${ytBtn.dataset.yt}?rel=0`;
            document.querySelectorAll('.js-switch-yt').forEach((b) => b.classList.toggle('active', b === ytBtn));
            return;
          }
          const lbImg = e.target.closest('.js-open-lb');
          if (lbImg) {
            openLightbox(parseInt(lbImg.dataset.idx, 10) || 0);
            return;
          }
          const personBtn = e.target.closest('.js-search-person');
          if (personBtn) {
            const name = personBtn.dataset.person;
            closeModal();
            state.tab = 'discover';
            state.actor = name;
            el('actor-input').value = name;
            syncClearButtons();
            updateTabUi();
            runSearch();
            return;
          }
          const simCard = e.target.closest('.js-open-sim');
          if (simCard) {
            openDetailModal(simCard.dataset.movieId, false);
          }
        });

        // Lightbox controls
        el('lb-close').addEventListener('click', closeLightbox);
        el('lb-prev').addEventListener('click', () => openLightbox(state.lightboxIdx - 1));
        el('lb-next').addEventListener('click', () => openLightbox(state.lightboxIdx + 1));
        el('lightbox').addEventListener('click', (e) => {
          if (e.target === el('lightbox')) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
          if (el('lightbox').classList.contains('open')) {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') openLightbox(state.lightboxIdx - 1);
            if (e.key === 'ArrowRight') openLightbox(state.lightboxIdx + 1);
            return;
          }
          if (e.key === 'Escape' && el('detail-modal').classList.contains('open')) {
            closeModal();
          }
        });
      }

      function updateTabUi() {
        document.querySelectorAll('.tab-btn').forEach((b) => {
          b.classList.toggle('active', b.dataset.tab === state.tab);
        });
      }

      // Initialize
      applyStaticTranslations();
      renderFilterChips();
      updateTabCounts();
      syncClearButtons();
      bindEvents();
      runSearch();
    })();
  </script>
</body>
</html>
